<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Groove Trainer icon: a snare drum with crossed sticks and a beat dot. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c232d"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c46a00"/>
      <stop offset="0.45" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#b35f00"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g id="art">
    <!-- sticks -->
    <g stroke-linecap="round">
      <line x1="150" y1="96" x2="300" y2="268" stroke="#2ee6c5" stroke-width="22"/>
      <line x1="362" y1="96" x2="212" y2="268" stroke="#2ee6c5" stroke-width="22"/>
      <circle cx="150" cy="96" r="17" fill="#2ee6c5"/>
      <circle cx="362" cy="96" r="17" fill="#2ee6c5"/>
    </g>
    <!-- drum shell -->
    <path d="M116 280 v96 a140 44 0 0 0 280 0 v-96 z" fill="url(#shell)"/>
    <!-- lugs -->
    <g fill="#0b0d10" opacity="0.55">
      <rect x="150" y="318" width="14" height="52" rx="6"/>
      <rect x="221" y="326" width="14" height="56" rx="6"/>
      <rect x="277" y="326" width="14" height="56" rx="6"/>
      <rect x="348" y="318" width="14" height="52" rx="6"/>
    </g>
    <!-- rims -->
    <path d="M116 376 a140 44 0 0 0 280 0" fill="none" stroke="#f4f7fa" stroke-width="12"/>
    <!-- head -->
    <ellipse cx="256" cy="280" rx="140" ry="44" fill="#f4f7fa"/>
    <ellipse cx="256" cy="280" rx="124" ry="34" fill="#dfe6ee"/>
    <!-- beat dot -->
    <circle cx="256" cy="278" r="16" fill="#ff9f1c"/>
  </g>
</svg>
